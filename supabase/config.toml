# Supabase CLI config (used with Docker: `npx supabase start`).
# Without Docker use `npm run db:start` (scripts/local-supabase), same migrations.
project_id = "happy-steps"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 5000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "16MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Accounts are created by administrators only (SPEC §4).
enable_signup = false
minimum_password_length = 8

[auth.email]
# Phone-based logins use a technical e-mail (DECISIONS.md D-004); no mail is sent.
enable_signup = false
enable_confirmations = false

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
